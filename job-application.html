<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Apply for a job with APEX WORKFORCE PRIVATE LIMITED.">
  <title>Job Application | APEX WORKFORCE PRIVATE LIMITED</title>
  <link rel="stylesheet" href="styles.css?v=full-brand-logo-2">
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html"><img class="logo-image" src="apex-workforce-logo.png" alt="APEX WORKFORCE — Your People. Our Priority."></a>
    </div>
  </header>

  <main>
    <section class="application-page">
      <div class="container">
        <div class="application-card">
          <h1>Job Application</h1>
          <p class="application-intro">Share your details and we will contact you about suitable opportunities.</p>

          <form class="application-form" id="job-application-form">
            <div class="application-field">
              <label for="applicant-name">Full Name *</label>
              <input id="applicant-name" name="name" autocomplete="name" required>
            </div>

            <div class="application-field">
              <label for="applicant-phone">Phone *</label>
              <input id="applicant-phone" name="phone" type="tel" autocomplete="tel" required>
            </div>

            <div class="application-field">
              <label for="applicant-email">Email</label>
              <input id="applicant-email" name="email" type="email" autocomplete="email">
            </div>

            <div class="application-field">
              <label for="applicant-role">Preferred Role</label>
              <input id="applicant-role" name="role" placeholder="For example: Sales, Driver, IT">
            </div>

            <div class="application-field">
              <label for="applicant-experience">Message / Experience</label>
              <textarea id="applicant-experience" name="experience" placeholder="Tell us about your experience and preferred location."></textarea>
            </div>

            <div class="application-field">
              <label for="applicant-resume">Upload Resume (PDF, DOC, or DOCX)</label>
              <input id="applicant-resume" name="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
              <small class="application-help">Optional. After WhatsApp opens, attach the selected resume to your message.</small>
            </div>

            <div class="application-actions">
              <button class="btn btn-primary" type="submit">Submit Application</button>
              <a class="application-back" href="index.html#jobs">Back to Jobs</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('job-application-form').addEventListener('submit', event => {
      event.preventDefault();

      const form = event.currentTarget;
      const data = new FormData(form);
      const resume = form.elements.namedItem('resume').files[0];
      const message = [
        'Hello APEX WORKFORCE, I would like to apply for a job.',
        `Name: ${data.get('name')}`,
        `Phone: ${data.get('phone')}`,
        `Email: ${data.get('email') || 'Not provided'}`,
        `Preferred Role: ${data.get('role') || 'Not provided'}`,
        `Experience/Message: ${data.get('experience') || 'Not provided'}`,
        `Resume: ${resume ? `${resume.name} (please attach this file)` : 'Not provided'}`
      ].join('\n');

      const whatsappUrl = `https://wa.me/917996300242?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
