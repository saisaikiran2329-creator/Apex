<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a job posting for APEX WORKFORCE PRIVATE LIMITED.">
  <title>Post a Job | APEX WORKFORCE PRIVATE LIMITED</title>
  <link rel="stylesheet" href="styles.css?v=full-brand-logo-2">
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html"><img class="logo-image" src="apex-workforce-logo.png" alt="APEX WORKFORCE — Your People. Our Priority."></a>
    </div>
  </header>

  <main>
    <section class="application-page">
      <div class="container">
        <div class="application-card">
          <h1>Post a job</h1>
          <p class="application-intro">Add a job opening. Published jobs will appear on the website for candidates.</p>

          <form class="application-form" id="job-form">
            <div class="application-field">
              <label for="job-title">Job title</label>
              <input id="job-title" name="title" type="text" maxlength="120" required>
            </div>

            <div class="application-field">
              <label for="job-location">Location</label>
              <input id="job-location" name="location" type="text" maxlength="120" required>
            </div>

            <div class="application-field">
              <label for="employment-type">Employment type</label>
              <input id="employment-type" name="employment_type" type="text" maxlength="80" placeholder="Full-time, part-time, contract..." required>
            </div>

            <div class="application-field">
              <label for="job-description">Job description</label>
              <textarea id="job-description" name="description" maxlength="3000" required></textarea>
            </div>

            <div class="application-actions">
              <button class="btn btn-primary" type="submit">Publish job</button>
              <a class="application-back" href="login-success.html">Back</a>
            </div>
            <p class="login-notice" id="job-notice" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    fetch('/api/session', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) {
          window.location.replace('/login.html');
        }
      })
      .catch(() => window.location.replace('/login.html'));

    const jobForm = document.getElementById('job-form');
    const jobNotice = document.getElementById('job-notice');

    jobForm.addEventListener('submit', async event => {
      event.preventDefault();
      const submitButton = jobForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      jobNotice.textContent = 'Publishing job...';

      try {
        const response = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(jobForm)))
        });
        const result = await response.json();
        if (response.status === 401) {
          window.location.assign('/login.html');
          return;
        }
        if (!response.ok) {
          jobNotice.textContent = result.error || 'The job could not be published.';
          return;
        }

        jobForm.reset();
        jobNotice.textContent = 'Job published successfully. View it on the website.';
      } catch {
        jobNotice.textContent = 'Could not reach the server. Please try again.';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
