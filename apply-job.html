<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Apply for a job opportunity with APEX WORKFORCE PRIVATE LIMITED.">
  <title>Apply for a Job | APEX WORKFORCE PRIVATE LIMITED</title>
  <link rel="stylesheet" href="styles.css?v=full-brand-logo-2">
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html"><img class="logo-image" src="apex-workforce-logo.png" alt="APEX WORKFORCE — Your People. Our Priority."></a>
    </div>
  </header>

  <main>
    <section class="application-page">
      <div class="container">
        <div class="application-card">
          <h1>Apply for a Job</h1>
          <p class="application-intro">Complete the form below to tell us about yourself and the opportunity you are looking for.</p>
          <p class="login-notice" id="selected-job-notice" role="status" aria-live="polite" hidden></p>

          <form class="application-form" id="apply-job-form">
            <div class="application-field">
              <label for="apply-name">Full Name *</label>
              <input id="apply-name" name="name" autocomplete="name" required>
            </div>

            <div class="application-field">
              <label for="apply-phone">Phone *</label>
              <input id="apply-phone" name="phone" type="tel" autocomplete="tel" required>
            </div>

            <div class="application-field">
              <label for="apply-email">Email</label>
              <input id="apply-email" name="email" type="email" autocomplete="email">
            </div>

            <div class="application-field">
              <label for="apply-role">Job / Preferred Role *</label>
              <input id="apply-role" name="role" placeholder="For example: Sales, Driver, IT" required>
            </div>

            <div class="application-field">
              <label for="apply-experience">Experience and Preferred Location</label>
              <textarea id="apply-experience" name="experience" placeholder="Tell us about your experience and preferred work location."></textarea>
            </div>

            <div class="application-field">
              <label for="apply-resume">Upload Resume (PDF, DOC, or DOCX)</label>
              <input id="apply-resume" name="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
              <small class="application-help">Optional. When WhatsApp opens, attach your selected resume to the message.</small>
            </div>

            <div class="application-actions">
              <button class="btn btn-primary" type="submit">Continue to WhatsApp</button>
              <a class="application-back" href="index.html#jobs">Back to Jobs</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    const applicationForm = document.getElementById('apply-job-form');
    const roleInput = applicationForm.elements.namedItem('role');
    const selectedJobNotice = document.getElementById('selected-job-notice');
    const applicationParams = new URLSearchParams(window.location.search);
    const selectedJobId = applicationParams.get('job');
    const demoRole = applicationParams.get('role');
    const demoLocation = applicationParams.get('location');
    const isDemoApplication = applicationParams.get('demo') === '1' && Boolean(demoRole);

    if (isDemoApplication) {
      roleInput.value = demoRole;
      selectedJobNotice.hidden = false;
      selectedJobNotice.textContent =
        `This is a sample listing, not a live vacancy. Your application message will use the example role: ${demoRole}${demoLocation ? ` — ${demoLocation}` : ''}.`;
    } else if (selectedJobId) {
      fetch('/api/jobs')
        .then(response => {
          if (!response.ok) {
            throw new Error('Could not load the selected job.');
          }
          return response.json();
        })
        .then(({jobs}) => {
          const selectedJob = Array.isArray(jobs)
            ? jobs.find(job => job.id === selectedJobId)
            : null;
          if (!selectedJob) {
            roleInput.value = '';
            selectedJobNotice.hidden = false;
            selectedJobNotice.textContent = 'This job is no longer available. Please return to the job search and choose another opening.';
            return;
          }
          roleInput.value = selectedJob.title;
          selectedJobNotice.hidden = false;
          selectedJobNotice.textContent = `Applying for: ${selectedJob.title} — ${selectedJob.location}`;
        })
        .catch(() => {
          roleInput.value = '';
          selectedJobNotice.hidden = false;
          selectedJobNotice.textContent = 'Could not load the selected job. Please return to the job search and try again.';
        });
    }

    applicationForm.addEventListener('submit', event => {
      event.preventDefault();

      const form = applicationForm;
      const data = new FormData(form);
      const resume = form.elements.namedItem('resume').files[0];
      const message = [
        `${isDemoApplication ? 'SAMPLE JOB EXAMPLE — ' : ''}Hello APEX WORKFORCE, I would like to apply for ${data.get('role')}.`,
        `Name: ${data.get('name')}`,
        `Phone: ${data.get('phone')}`,
        `Email: ${data.get('email') || 'Not provided'}`,
        `Preferred Role: ${data.get('role')}`,
        `Experience/Location: ${data.get('experience') || 'Not provided'}`,
        `Resume: ${resume ? `${resume.name} (please attach this file)` : 'Not provided'}`
      ].join('\n');

      const whatsappUrl = `https://wa.me/917996300242?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
